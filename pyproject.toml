[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[project]
name = "skim"
version = "0.1.0"
description = "Inspect, annotate, and review agent artifacts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pygments>=2.21.0",
    "rich>=15.0.0",
    "textual[syntax]>=8.2.8",
]

[project.scripts]
skim = "skim.cli:main"
skim-dev = "skim.cli:dev"
skim-web = "skim.cli:web"

[dependency-groups]
dev = ["ruff", "pytest", "pyright", "poethepoet"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "D",  # pydocstyle
]
ignore = []


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["mlflow_monitor"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.poe]
executor = "simple"

[tool.poe.tasks]
test = "pytest"
lint = "ruff check ."
format-check = "ruff format --check ."
format = "ruff format ."
typecheck = "pyright"
build = "uv build"
validate = ["test", "lint", "format-check", "typecheck", "build"]
